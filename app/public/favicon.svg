<!--
  Icono de pestaña de SolarMe.

  El que estaba aquí era un glifo púrpura (#863bff) heredado de una plantilla: no tiene relación
  con esta marca, cuyo emblema es el sol naranja que ya aparece en la barra lateral (lucide `Sun`
  en el color solar-500). Una pestaña con el icono de otro producto es lo primero que ve el cliente
  al que el instalador le muestra la propuesta en pantalla.

  Se dibuja a mano en vez de exportar el icono de la librería porque a 16 px el trazo hueco del
  original se pierde: aquí el disco va relleno y los rayos llevan un trazo más grueso, de modo que
  la silueta siga leyéndose como un sol en el tamaño real de una pestaña.

  El nombre de la variable de color se escribe sin sus dos guiones iniciales a propósito: un
  comentario XML no admite dos guiones seguidos, y con ellos este archivo deja de estar bien
  formado. Los rasterizadores tolerantes lo dibujan igual, así que el fallo no se ve por ninguna
  parte hasta que un consumidor estricto se lo come. Lo vigila una prueba.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="SolarMe">
  <circle cx="12" cy="12" r="4.6" fill="#ea580c" />
  <g stroke="#ea580c" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M12 1.7v2.4M12 19.9v2.4M1.7 12h2.4M19.9 12h2.4" />
    <path d="M4.4 4.4l1.8 1.8M17.8 17.8l1.8 1.8M19.6 4.4l-1.8 1.8M6.2 17.8l-1.8 1.8" />
  </g>
</svg>
